<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NumPy Quick Reference — Offline Syntax Helper</title>
<style>
:root{
  --bg:#faf9f6; --surface:#ffffff; --surface-2:#f2f1ec; --ink:#1c1f26; --muted:#5b6470;
  --border:#e4e2da; --accent:#3651d4; --accent-ink:#ffffff; --accent-soft:#eaedff;
  --code-bg:#f4f3ee; --code-ink:#22262f; --shadow:0 1px 2px rgba(28,31,38,.06),0 4px 14px rgba(28,31,38,.05);
  --fn:#3651d4; --meth:#a35a1f; --attr:#1f8f5f; --const:#a02b6f; --mod:#5b6470; --op:#0f7a86; --concept:#6b4fbb;
  --radius:10px; --mono:ui-monospace,SFMono-Regular,'JetBrains Mono',Consolas,Menlo,monospace;
  --sans:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
}
[data-theme="dark"]{
  --bg:#0e1015; --surface:#161923; --surface-2:#1d2129; --ink:#e7e9ef; --muted:#8b93a3;
  --border:#2a2f3a; --accent:#7b93ff; --accent-ink:#0e1015; --accent-soft:#1c2340;
  --code-bg:#12141b; --code-ink:#dbe0ea; --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 18px rgba(0,0,0,.35);
  --fn:#7b93ff; --meth:#e0a25c; --attr:#4bd694; --const:#e07fc0; --mod:#8b93a3; --op:#4fd0dc; --concept:#b39bff;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.5;font-size:15px}
code,pre,kbd{font-family:var(--mono)}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
::selection{background:var(--accent-soft)}

/* ---------- HEADER ---------- */
header.top{position:sticky;top:0;z-index:50;background:var(--surface);border-bottom:1px solid var(--border);
  display:flex;align-items:center;gap:14px;padding:10px 16px}
.brand{display:flex;align-items:center;gap:10px;white-space:nowrap}
.brand .mark{width:34px;height:34px;border-radius:8px;background:var(--accent);color:var(--accent-ink);
  display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:2px;padding:5px;flex:none}
.brand .mark i{background:currentColor;opacity:.9;border-radius:2px}
.brand h1{font-size:16px;margin:0;font-weight:700;letter-spacing:.2px}
.brand small{display:block;color:var(--muted);font-weight:500;font-size:11px;margin-top:1px}
.ver-pill{font-family:var(--mono);font-size:11px;background:var(--surface-2);border:1px solid var(--border);
  color:var(--muted);padding:3px 8px;border-radius:100px;flex:none}
.searchwrap{flex:1;max-width:640px;position:relative;margin-left:auto}
#searchInput{width:100%;padding:9px 76px 9px 36px;border-radius:8px;border:1px solid var(--border);
  background:var(--surface-2);color:var(--ink);font-size:14px;outline:none}
#searchInput:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.searchwrap svg.icon{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--muted)}
.kbd-hint{position:absolute;right:8px;top:50%;transform:translateY(-50%);display:flex;gap:4px}
.kbd-hint kbd{font-size:10px;color:var(--muted);background:var(--surface);border:1px solid var(--border);
  border-radius:5px;padding:2px 5px}
#resultCount{position:absolute;right:8px;top:-20px;font-size:11px;color:var(--muted);display:none}
.iconbtn{border:1px solid var(--border);background:var(--surface-2);color:var(--ink);width:36px;height:36px;
  border-radius:8px;display:grid;place-items:center;cursor:pointer;flex:none}
.iconbtn:hover{border-color:var(--accent)}
#menuBtn{display:none}

/* ---------- LAYOUT ---------- */
.shell{display:flex;max-width:1500px;margin:0 auto}
nav.sidebar{width:260px;flex:none;position:sticky;top:57px;align-self:flex-start;height:calc(100vh - 57px);
  overflow-y:auto;padding:16px 10px 40px;border-right:1px solid var(--border)}
nav.sidebar a{display:flex;gap:8px;align-items:baseline;color:var(--muted);padding:7px 10px;border-radius:7px;
  font-size:13.5px;font-weight:500}
nav.sidebar a .n{font-family:var(--mono);font-size:11px;color:var(--muted);opacity:.7;flex:none;width:20px}
nav.sidebar a:hover{background:var(--surface-2);color:var(--ink);text-decoration:none}
nav.sidebar a.active{background:var(--accent-soft);color:var(--accent);font-weight:700}
nav.sidebar a.active .n{color:var(--accent);opacity:1}
main{flex:1;min-width:0;padding:26px 30px 100px}

/* ---------- SECTION / CARDS ---------- */
section.sec{margin-bottom:46px;scroll-margin-top:70px}
section.sec > h2{font-size:20px;margin:0 0 4px;display:flex;align-items:center;gap:10px}
section.sec > h2 .idx{font-family:var(--mono);font-size:13px;color:var(--accent);background:var(--accent-soft);
  padding:2px 8px;border-radius:6px}
section.sec > p.desc{color:var(--muted);margin:0 0 16px;font-size:13.5px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:14px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;
  box-shadow:var(--shadow)}
.card .head{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.card .head .name{font-family:var(--mono);font-weight:700;font-size:14.5px}
.badge{font-size:10px;text-transform:uppercase;letter-spacing:.4px;font-weight:700;padding:2px 7px;border-radius:100px;
  color:#fff;flex:none}
.b-function{background:var(--fn)}.b-method{background:var(--meth)}.b-attribute{background:var(--attr)}
.b-constant{background:var(--const)}.b-module{background:var(--mod)}.b-operator{background:var(--op)}
.b-concept{background:var(--concept)}
pre[data-copy]{margin:0;background:var(--code-bg);color:var(--code-ink);border-radius:8px;padding:9px 34px 9px 11px;
  overflow-x:auto;font-size:12.6px;position:relative;border:1px solid var(--border);
  white-space:pre-wrap;word-break:break-word}
pre[data-copy] + pre[data-copy]{margin-top:8px}
.copybtn{position:absolute;top:6px;right:6px;background:var(--surface);border:1px solid var(--border);color:var(--muted);
  font-size:10px;padding:3px 7px;border-radius:6px;cursor:pointer;font-family:var(--sans)}
.copybtn:hover{color:var(--accent);border-color:var(--accent)}
.copybtn.copied{color:#1f8f5f;border-color:#1f8f5f}
.lbl{font-size:10.5px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);font-weight:700;margin:10px 0 4px}
.card .params{font-size:12.5px;color:var(--ink)}
.card .params .p{margin-bottom:2px}
.card .params .p b{font-family:var(--mono);color:var(--accent);font-weight:700}
.card .ret,.card .use,.card .note{font-size:12.8px}
.card .note{background:var(--surface-2);border-left:3px solid var(--accent);padding:6px 9px;border-radius:6px}
.card .foot{margin-top:10px;font-size:12px}
mark{background:#ffe27a;color:#1c1f26;padding:0 2px;border-radius:2px}
[data-theme="dark"] mark{background:#8a6d1f;color:#fff}

/* ---------- TABLE ---------- */
table.ref{width:100%;border-collapse:collapse;background:var(--surface);border:1px solid var(--border);
  border-radius:var(--radius);overflow:hidden;font-size:13px}
table.ref th{background:var(--surface-2);text-align:left;padding:9px 12px;font-size:11.5px;text-transform:uppercase;
  letter-spacing:.4px;color:var(--muted);border-bottom:1px solid var(--border)}
table.ref td{padding:9px 12px;border-bottom:1px solid var(--border);vertical-align:top}
table.ref tr:last-child td{border-bottom:none}
table.ref td code,table.ref td.mono{font-family:var(--mono);font-size:12.5px;color:var(--fn)}
table.ref{margin-bottom:6px}
.tablewrap{overflow-x:auto}

/* ---------- SNIPPETS / TEXT ---------- */
.snip{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:12px 14px;
  box-shadow:var(--shadow)}
.snip h4{margin:0 0 8px;font-size:13.5px}
.snip .note{font-size:12px;color:var(--muted);margin-top:6px}
.prose{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:18px 20px;
  box-shadow:var(--shadow)}
.prose h3{font-size:15px;margin:18px 0 8px}
.prose h3:first-child{margin-top:0}
.prose ul{margin:6px 0;padding-left:20px;font-size:13.5px}
.prose li{margin-bottom:6px}
.prose pre{background:var(--code-bg);border:1px solid var(--border);padding:10px 12px;border-radius:8px;
  overflow-x:auto;font-size:12.6px;margin:8px 0;white-space:pre-wrap;word-break:break-word}
.diagram{font-family:var(--mono);font-size:12.5px;background:var(--code-bg);border:1px solid var(--border);
  border-radius:8px;padding:12px;overflow-x:auto;white-space:pre;line-height:1.6}
.mistake{border-left:3px solid #d4463f;padding:8px 12px;background:var(--surface-2);border-radius:6px;margin-bottom:10px}
.mistake b{color:#d4463f}
.tip{border-left:3px solid #1f8f5f;padding:8px 12px;background:var(--surface-2);border-radius:6px;margin-bottom:10px}
.reslist a{display:block;padding:8px 0;border-bottom:1px solid var(--border);font-size:13.5px}
.reslist a:last-child{border-bottom:none}
.reslist span{display:block;color:var(--muted);font-size:12px}

/* ---------- MISC ---------- */
#backTop{position:fixed;bottom:22px;right:22px;width:42px;height:42px;border-radius:50%;background:var(--accent);
  color:var(--accent-ink);border:none;display:none;place-items:center;cursor:pointer;box-shadow:var(--shadow);z-index:40}
#backTop.show{display:grid}
.hidden{display:none !important}
.emptyState{color:var(--muted);font-size:13.5px;padding:30px;text-align:center}
footer.site{text-align:center;color:var(--muted);font-size:12px;padding:30px;border-top:1px solid var(--border)}

@media (max-width:900px){
  #menuBtn{display:grid}
  .searchwrap{max-width:none}
  .kbd-hint{display:none}
  nav.sidebar{position:fixed;left:0;top:57px;height:calc(100vh - 57px);width:270px;background:var(--surface);
    transform:translateX(-105%);transition:transform .2s ease;z-index:60;box-shadow:var(--shadow)}
  nav.sidebar.open{transform:translateX(0)}
  main{padding:18px 14px 100px}
  .brand small{display:none}
  .ver-pill{display:none}
  .grid{grid-template-columns:1fr}
}
</style>
</head>
<body>

<header class="top">
  <button id="menuBtn" class="iconbtn" aria-label="Toggle menu">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
  </button>
  <div class="brand">
    <div class="mark"><i></i><i></i><i></i><i></i></div>
    <div>
      <h1>NumPy Quick Reference</h1>
      <small>Offline syntax helper &amp; API cheat sheet</small>
    </div>
  </div>
  <span class="ver-pill">covers v2.5 · py≥3.12</span>
  <div class="searchwrap">
    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
    <input id="searchInput" type="text" placeholder="Search functions, keywords, params… ( / )" autocomplete="off">
    <div id="resultCount"></div>
    <span class="kbd-hint"><kbd>Ctrl</kbd><kbd>K</kbd></span>
  </div>
  <button id="themeBtn" class="iconbtn" aria-label="Toggle theme">
    <svg id="themeIcon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M1 12h2M21 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4"/></svg>
  </button>
</header>

<div class="shell">
  <nav class="sidebar" id="sidebar"></nav>
  <main id="content"></main>
</div>

<button id="backTop" aria-label="Back to top">
  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
</button>

<footer class="site">NumPy Quick Reference · built for fast offline lookup · verified against numpy.org/doc/stable · not affiliated with the NumPy project</footer>

<script>
/* ============================================================
   DATA
   Card item field order:
   [ name, kind, signature, params, returns, example, output, use, note, docLink, tags ]
   kind ∈ function | method | attribute | constant | module | operator | concept
   ============================================================ */
const NP = "https://numpy.org/doc/stable/reference/generated/numpy.";
const NPL = "https://numpy.org/doc/stable/reference/generated/numpy.linalg.";
const NPR = "https://numpy.org/doc/stable/reference/random/generated/numpy.random.";

const SECTIONS = [

{id:"install", num:"01", title:"Installation & Import", type:"html", html:`
<div class="prose">
<h3>Install</h3>
<pre>pip install numpy
conda install numpy</pre>
<h3>Import (universal convention)</h3>
<pre>import numpy as np</pre>
<h3>Check version</h3>
<pre>np.__version__
# e.g. '2.5.1'</pre>
<p style="font-size:13.5px;color:var(--muted)">This reference covers <b>NumPy 2.5.x</b> (latest stable). NumPy 2.5 requires <b>Python ≥ 3.12</b>. Some names shown as "deprecated" still work but print a warning — prefer the replacement listed.</p>
</div>`},

{id:"array-creation", num:"02", title:"Array Creation", type:"cards",
 desc:"Functions that build a new ndarray from scratch, from data, or from another array's shape.",
 items:[
["np.array()","function","np.array(object, dtype=None, copy=True, order='K', ndmin=0)",
 "object: array-like input · dtype: target data-type, inferred if None · copy: always copies by default · order: memory layout · ndmin: minimum number of dimensions",
 "ndarray","np.array([1, 2, 3])","array([1, 2, 3])",
 "Build an array from a Python list, tuple, or nested sequence.",
 "Always copies unless copy=False is set. Nested lists create multi-dimensional arrays.",
 NP+"array.html","array create list tuple"],
["np.asarray()","function","np.asarray(a, dtype=None, order=None)",
 "a: input data · dtype: optional target type · order: 'C' or 'F'",
 "ndarray (view, no copy when possible)","np.asarray([1, 2, 3])","array([1, 2, 3])",
 "Convert input to an array without copying when the input is already an ndarray of the right dtype.",
 "Faster than np.array() inside functions since it avoids redundant copies.",
 NP+"asarray.html","asarray convert no-copy"],
["np.zeros()","function","np.zeros(shape, dtype=float, order='C')",
 "shape: int or tuple of ints · dtype: default float64 · order: 'C' or 'F'",
 "ndarray filled with 0","np.zeros((2, 3))","array([[0., 0., 0.],\n       [0., 0., 0.]])",
 "Pre-allocate an array before filling it in a loop.",
 "Use np.zeros_like(a) to copy another array's shape and dtype.",
 NP+"zeros.html","zeros allocate init"],
["np.ones()","function","np.ones(shape, dtype=float, order='C')",
 "shape: int or tuple of ints · dtype: default float64 · order: 'C' or 'F'",
 "ndarray filled with 1","np.ones((2, 2))","array([[1., 1.],\n       [1., 1.]])",
 "Initialize weights, masks or counters.",
 "Combine with a scalar multiply for a constant-fill array, e.g. np.ones((2,2)) * 5.",
 NP+"ones.html","ones allocate init"],
["np.empty()","function","np.empty(shape, dtype=float, order='C')",
 "shape: int or tuple of ints · dtype: default float64 · order: 'C' or 'F'",
 "ndarray with uninitialized values","np.empty((2, 2))","array([[?, ?],\n       [?, ?]])  # garbage values",
 "Fastest allocation when every element will be overwritten immediately.",
 "Values are whatever was already in memory — never read before writing.",
 NP+"empty.html","empty allocate uninitialized"],
["np.full()","function","np.full(shape, fill_value, dtype=None)",
 "shape: int or tuple of ints · fill_value: scalar to fill · dtype: inferred from fill_value if None",
 "ndarray filled with fill_value","np.full((2, 2), 7)","array([[7, 7],\n       [7, 7]])",
 "Create a constant-value matrix in one call.",
 "dtype is inferred from fill_value unless explicitly given.",
 NP+"full.html","full constant fill"],
["np.eye()","function","np.eye(N, M=None, k=0, dtype=float)",
 "N: number of rows · M: number of columns, defaults to N · k: diagonal offset (0=main) · dtype: default float64",
 "2-D array with ones on the k-th diagonal","np.eye(3, k=1)","array([[0., 1., 0.],\n       [0., 0., 1.],\n       [0., 0., 0.]])",
 "Build identity-like or shifted-diagonal matrices.",
 "Use k to shift the diagonal up (+) or down (−). Use np.identity() for the plain square case.",
 NP+"eye.html","eye identity diagonal"],
["np.identity()","function","np.identity(n, dtype=float)",
 "n: size of the square matrix · dtype: default float64",
 "n x n identity matrix","np.identity(3)","array([[1., 0., 0.],\n       [0., 1., 0.],\n       [0., 0., 1.]])",
 "Linear algebra identity matrix for solving systems or resetting transforms.",

 NP+"identity.html","identity square matrix"],
["np.diag()","function","np.diag(v, k=0)",
 "v: 1-D array (builds a matrix) or 2-D array (extracts a diagonal) · k: diagonal offset",
 "2-D array or 1-D array, depending on input","np.diag([1, 2, 3])","array([[1, 0, 0],\n       [0, 2, 0],\n       [0, 0, 3]])",
 "Build a diagonal matrix from a vector, or pull the diagonal out of a matrix.",
 "Behavior depends entirely on the input's ndim — 1-D builds, 2-D extracts.",
 NP+"diag.html","diag diagonal matrix"],
["np.arange()","function","np.arange([start,] stop[, step,], dtype=None)",
 "start: default 0 · stop: exclusive end · step: default 1 · dtype: inferred if None",
 "1-D ndarray","np.arange(0, 10, 2)","array([0, 2, 4, 6, 8])",
 "Generate evenly spaced integers, Python range() with array output.",
 "stop is excluded. With float steps, rounding error can add an extra element — prefer linspace() for floats.",
 NP+"arange.html","arange range sequence"],
["np.linspace()","function","np.linspace(start, stop, num=50, endpoint=True, retstep=False, dtype=None)",
 "start, stop: range bounds · num: number of samples · endpoint: include stop if True · retstep: also return spacing",
 "1-D ndarray of num evenly spaced floats","np.linspace(0, 1, 5)","array([0.  , 0.25, 0.5 , 0.75, 1.  ])",

["np.logspace()","function","np.logspace(start, stop, num=50, base=10.0)",

 "start/stop are exponents, not the actual values — that is geomspace() below.",
 NP+"logspace.html","logspace log scale"],
["np.geomspace()","function","np.geomspace(start, stop, num=50)",
 "start, stop: actual endpoint values (not exponents) · num: sample count",
 "1-D ndarray, geometric progression","np.geomspace(1, 1000, 4)","array([   1.,   10.,  100., 1000.])",
 "Log-scaled samples when you know the real start/stop values.",
 "Same result as logspace() here, but you pass real numbers instead of exponents.",
 NP+"geomspace.html","geomspace geometric"],
["np.indices()","function","np.indices(dimensions, dtype=int)",
 "dimensions: shape of the grid · dtype: default int",
 "array of shape (len(dimensions), *dimensions)","np.indices((2, 2))","array([[[0, 0], [1, 1]],\n       [[0, 1], [0, 1]]])",
 "Get per-axis index grids for vectorized coordinate math.",
 "First axis of the result selects which coordinate (row-index grid vs column-index grid).",
 NP+"indices.html","indices grid coordinates"],
["np.meshgrid()","function","np.meshgrid(*xi, indexing='xy')",
 "*xi: 1-D coordinate vectors · indexing: 'xy' (Cartesian, default) or 'ij' (matrix)",
 "tuple of coordinate matrices","X, Y = np.meshgrid([1,2],[3,4])","X=[[1,2],[1,2]]  Y=[[3,3],[4,4]]",
 "Build 2-D coordinate grids for surface plots or vectorized functions of (x,y).",
 "indexing='xy' swaps the first two output dimensions relative to 'ij' — a common source of shape bugs.",
 NP+"meshgrid.html","meshgrid grid plot"],
["np.fromfunction()","function","np.fromfunction(function, shape, dtype=float)",
 "function: callable taking one index array per dimension · shape: output shape · dtype: index dtype",

 "Construct an array by evaluating a function over coordinate grids.",

 NP+"fromfunction.html","fromfunction generate"],
["np.fromiter()","function","np.fromiter(iter, dtype, count=-1)",
 "iter: any Python iterable/generator · dtype: required · count: expected length for pre-allocation",
 "1-D ndarray","np.fromiter(range(5), dtype=int)","array([0, 1, 2, 3, 4])",
 "Materialize a generator into an array without building an intermediate list.",
 "dtype is mandatory. Passing count avoids repeated resizing and is much faster for large iterables.",

 "buffer: any object exposing the buffer protocol (bytes, bytearray…) · dtype · count: elements to read · offset: start byte",

["np.empty_like()","function","np.empty_like(a, dtype=None, shape=None)",
 "a: template array · dtype: override, else matches a · shape: override, else matches a",
 "uninitialized ndarray matching a's shape/dtype","np.empty_like(a)","# same shape & dtype as a, garbage values",

{id:"indexing", num:"05", title:"Indexing & Slicing", type:"cards",
 desc:"How to pull elements, rows, or sub-arrays out of an ndarray.",
 items:[
["Single index","concept","a[0]  ·  a[1, 2]",
 "One integer per axis",
 "scalar (or lower-dim array if fewer indices than axes)","a = np.array([10,20,30]); a[1]","20",
 "Access one element directly.","Negative and multi-axis forms combine freely: a[-1, 0].",
 "https://numpy.org/doc/stable/user/basics.indexing.html","index single element"],
["Negative index","concept","a[-1]  ·  a[-2]",
 "-1 = last element, -2 = second-to-last, etc.",
 "scalar or sub-array","a = np.array([1,2,3]); a[-1]","3",
 "Access elements from the end without knowing the length.","Works on every axis: a[:, -1] gets the last column.",
 "https://numpy.org/doc/stable/user/basics.indexing.html","negative index last"],
["Slice","concept","a[start:stop]  ·  a[start:stop:step]",
 "start: default 0 · stop: exclusive, default end · step: default 1",
 "a VIEW sharing memory with a","a = np.arange(6); a[1:4]","array([1, 2, 3])",
 "Extract a contiguous range without copying.","Basic slices are views — modifying the slice modifies the original array.",
 "https://numpy.org/doc/stable/user/basics.indexing.html","slice range view"],
["Step","concept","a[::2]  ·  a[::-1]",
 "step controls the stride; negative step reverses direction",
 "view (when possible)","a = np.arange(6); a[::-1]","array([5, 4, 3, 2, 1, 0])",
 "Take every Nth element, or reverse an array.","a[::-1] is the idiomatic way to reverse any axis.",
 "https://numpy.org/doc/stable/user/basics.indexing.html","step stride reverse"],
["Boolean indexing","concept","a[condition]",
 "condition: boolean array, same shape as a (or broadcastable)",
 "1-D COPY containing only True positions","a = np.array([1,5,2,8]); a[a > 3]","array([5, 8])",
 "Filter elements matching a condition.","Always returns a copy, never a view. Combine conditions with & | ~ and parentheses (not and/or/not).",
 "https://numpy.org/doc/stable/user/basics.indexing.html","boolean mask filter"],
["Fancy indexing","concept","a[[0, 2, 4]]  ·  a[idx_array]",
 "idx_array: integer array/list of positions, any order, repeats allowed",
 "COPY, shaped like the index array","a = np.array([10,20,30,40]); a[[3,0,0]]","array([40, 10, 10])",
 "Reorder, repeat, or gather arbitrary elements in one call.","Unlike slicing, this always copies — edits do not affect the original array.",
 "https://numpy.org/doc/stable/user/basics.indexing.html","fancy gather reorder"],
["Integer array indexing (multi-dim)","concept","a[[0,1],[1,2]]",
 "One index array per axis; they are paired element-wise, not as a grid",
 "1-D array of the paired-up elements","a = np.arange(9).reshape(3,3); a[[0,1],[1,2]]","array([1, 5])",
 "Pick out specific (row, col) coordinate pairs at once.","Pairs elements positionally — use np.ix_() for a full grid combination instead.",
 "https://numpy.org/doc/stable/user/basics.indexing.html","integer indexing coordinates"],
["Ellipsis ( ... )","concept","a[..., 0]  ·  a[0, ...]",
 "... expands to as many full slices (:) as needed to fill remaining axes",
 "sub-array","a = np.zeros((2,3,4)); a[..., 0].shape","(2, 3)",
 "Index the first/last axis of an array with unknown or variable dimensionality.","Only one ellipsis is allowed per indexing expression.",
 "https://numpy.org/doc/stable/user/basics.indexing.html","ellipsis dots"],
["np.newaxis","concept","a[:, np.newaxis]  ·  a[np.newaxis, :]",
 "newaxis is an alias for None; inserts a size-1 axis at that position",
 "view with one more dimension","a = np.array([1,2,3]); a[:, np.newaxis].shape","(3, 1)",
 "Turn a 1-D array into a column or row vector for broadcasting.","Equivalent to np.expand_dims(a, axis) but usable inline in an indexing expression.",
 NP+"newaxis.html","newaxis expand dims none"],
["Masking (combined conditions)","concept","a[(a>0) & (a<10)]",
 "Combine boolean arrays with & (and), | (or), ~ (not) — always parenthesized",
 "1-D copy of matching elements","a=np.arange(-2,5); a[(a>0)&(a<3)]","array([1, 2])",
 "Filter on multiple criteria at once.","Python's and/or/not do not work element-wise on arrays — using them raises an error or gives wrong results.",
 "https://numpy.org/doc/stable/user/basics.indexing.html","masking combine conditions"],
["Views vs Copies","concept","a.base is not None  →  view",
 "Basic slicing → view (shares memory). Boolean/fancy indexing → copy (independent memory)",
 "—","v = a[1:3]; v.base is a","True",
 "Know when editing a slice will silently change the original array.","Check with arr.base or np.shares_memory(a, b) if unsure; use .copy() to force independence.",
 "https://numpy.org/doc/stable/user/basics.copies.html","view copy memory shares_memory"],
 ]},

{id:"reshaping", num:"06", title:"Reshaping Arrays", type:"cards",
 desc:"Change an array's shape, axis order, or dimensionality without altering its data.",
 items:[
["np.reshape() / a.reshape()","function","np.reshape(a, newshape, order='C')",
 "a: input array · newshape: new shape tuple, one dim may be -1 to infer · order: 'C' or 'F' traversal",
 "ndarray — view when possible, else a copy","np.arange(6).reshape(2, 3)","array([[0, 1, 2],\n       [3, 4, 5]])",
 "Change dimensions before feeding data into a model.","Total element count must stay the same; -1 lets NumPy compute one dimension automatically.",
 NP+"reshape.html","reshape shape dims"],
["a.flatten()","method","a.flatten(order='C')",
 "order: traversal order for reading elements",
 "1-D ndarray, ALWAYS a copy","np.array([[1,2],[3,4]]).flatten()","array([1, 2, 3, 4])",
 "Get a safe, independent 1-D version of a multi-dim array.","Always copies — safe to mutate without touching the original.",
 NP+"ndarray.flatten.html","flatten 1d copy"],
["np.ravel() / a.ravel()","function","np.ravel(a, order='C')",
 "a: input array · order: traversal order",
 "1-D array, VIEW when possible","np.ravel([[1,2],[3,4]])","array([1, 2, 3, 4])",
 "Fast 1-D flattening when you do not need an independent copy.",
 "Returns a view whenever the memory layout allows it — faster than flatten() but can alias the original.",
 NP+"ravel.html","ravel flatten view"],
["a.resize()","method","a.resize(new_shape, refcheck=True)",
 "new_shape: target shape · refcheck: safety check for other references",
 "None — modifies a IN PLACE","a=np.array([1,2,3]); a.resize(2,2)","a → [[1,2],[3,0]]  # padded with 0",
 "Change size in place, padding with zeros or truncating.",
 "np.resize(a, shape) (function form) instead REPEATS data to fill the new size and returns a new array.",
 NP+"ndarray.resize.html","resize inplace pad"],
["np.transpose() / a.T","function","np.transpose(a, axes=None)",
 "a: input array · axes: new axis order, default reverses all axes",
 "ndarray view with permuted axes","np.transpose(np.ones((2,3))).shape","(3, 2)",
 "Swap rows/columns, or reorder axes for tensors.","a.T is shorthand only for the default (fully reversed) axis order.",
 NP+"transpose.html","transpose axes swap"],
["np.swapaxes()","function","np.swapaxes(a, axis1, axis2)",
 "a: input array · axis1, axis2: the two axes to swap",
 "ndarray view","np.swapaxes(np.zeros((2,3,4)), 0, 2).shape","(4, 3, 2)",
 "Swap exactly two specific axes in an n-dimensional array.","Simpler than transpose() when only two axes need to move.",
 NP+"swapaxes.html","swapaxes axes"],
["np.moveaxis()","function","np.moveaxis(a, source, destination)",
 "source: axis index(es) to move · destination: where they should end up",
 "ndarray view","np.moveaxis(np.zeros((2,3,4)), 0, -1).shape","(3, 4, 2)",
 "Reposition one or more axes, e.g. moving a channel axis for image libraries.","More readable than transpose() when you only want to relocate a couple of axes.",
 NP+"moveaxis.html","moveaxis axis order"],
["np.expand_dims()","function","np.expand_dims(a, axis)",
 "a: input array · axis: position(s) where new size-1 axis is inserted",
 "ndarray view with one/more extra dims","np.expand_dims(np.array([1,2,3]), axis=0).shape","(1, 3)",
 "Add a batch or channel dimension for broadcasting/ML frameworks.","Equivalent to a[:, np.newaxis] style indexing.",
 NP+"expand_dims.html","expand_dims newaxis"],
["np.squeeze() / a.squeeze()","function","np.squeeze(a, axis=None)",
 "a: input array · axis: specific size-1 axis to remove; all size-1 axes if None",
 "ndarray view with size-1 axes removed","np.zeros((1,3,1)).squeeze().shape","(3,)",
 "Drop leftover singleton dimensions after reductions.","Raises an error if you name an axis whose size is not 1.",
 NP+"squeeze.html","squeeze remove dims"],
["np.broadcast_to()","function","np.broadcast_to(array, shape)",
 "array: input · shape: target broadcast shape",
 "READ-ONLY view repeating array to shape","np.broadcast_to([1,2,3], (2,3))","array([[1,2,3],[1,2,3]])",
 "Preview or reuse a broadcasted shape without allocating new memory.","Result is read-only since it aliases the same underlying data repeatedly.",
 NP+"broadcast_to.html","broadcast_to expand"],
["np.repeat()","function","np.repeat(a, repeats, axis=None)",
 "a: input array · repeats: int or array of ints per element · axis: axis to repeat along; flattens if None",
 "ndarray (copy)","np.repeat([1,2], 3)","array([1, 1, 1, 2, 2, 2])",
 "Repeat individual elements, e.g. upsampling labels.","Repeats each ELEMENT — contrast with tile(), which repeats the whole array.",
 NP+"repeat.html","repeat elements"],
["np.tile()","function","np.tile(A, reps)",
 "A: input array · reps: number of repetitions per axis (int or tuple)",
 "ndarray (copy)","np.tile([1,2], 2)","array([1, 2, 1, 2])",
 "Repeat a whole array/pattern, e.g. tiling a small image.","Repeats the WHOLE array as a block — contrast with repeat().",
 NP+"tile.html","tile pattern repeat whole"],
 ]},

{id:"joining-splitting", num:"07", title:"Joining & Splitting", type:"cards",
 desc:"Combine multiple arrays into one, or break one array into several.",
 items:[
["np.concatenate()","function","np.concatenate((a1, a2, ...), axis=0)",
 "sequence of arrays with matching shape except along axis · axis: join axis",
 "ndarray","np.concatenate(([1,2],[3,4]))","array([1, 2, 3, 4])",
 "General-purpose join along any existing axis.","Does NOT create a new axis — arrays must already have matching ndim.",
 NP+"concatenate.html","concatenate join combine"],
["np.stack()","function","np.stack(arrays, axis=0)",
 "arrays: sequence with IDENTICAL shape · axis: where the new axis is inserted",
 "ndarray with one MORE dimension than inputs","np.stack(([1,2],[3,4]))","array([[1, 2],\n       [3, 4]])",
 "Combine equal-shaped arrays into a new batch dimension.","Unlike concatenate(), stack() adds a brand-new axis, so all inputs must match exactly.",
 NP+"stack.html","stack new-axis batch"],
["np.hstack()","function","np.hstack(tup)",
 "tup: sequence of arrays",
 "ndarray joined horizontally (axis 1, or axis 0 for 1-D)","np.hstack(([1,2],[3,4]))","array([1, 2, 3, 4])",
 "Concatenate side-by-side, e.g. adding feature columns.","For 1-D inputs behaves like concatenate along axis 0.",
 NP+"hstack.html","hstack horizontal"],
["np.vstack()","function","np.vstack(tup)",
 "tup: sequence of arrays",
 "ndarray joined vertically, at least 2-D","np.vstack(([1,2],[3,4]))","array([[1, 2],\n       [3, 4]])",
 "Stack rows on top of each other, e.g. adding samples.","1-D inputs are first promoted to rows before stacking.",
 NP+"vstack.html","vstack vertical rows"],
["np.dstack()","function","np.dstack(tup)",
 "tup: sequence of arrays",
 "ndarray joined along the 3rd axis (depth)","np.dstack(([1,2],[3,4])).shape","(1, 2, 2)",
 "Combine 2-D arrays into a multi-channel volume, e.g. image channels.","Inputs are promoted to at least 3-D before stacking depth-wise.",
 NP+"dstack.html","dstack depth channels"],
["np.column_stack()","function","np.column_stack(tup)",
 "tup: sequence of 1-D or 2-D arrays",
 "2-D ndarray with inputs as columns","np.column_stack(([1,2],[3,4]))","array([[1, 3],\n       [2, 4]])",
 "Turn several 1-D vectors into a table of columns.","For 1-D inputs, equivalent to hstack after adding a column axis to each.",
 NP+"column_stack.html","column_stack table columns"],
["np.row_stack()  (deprecated)","function","np.row_stack(tup)  — use np.vstack(tup) instead",
 "Same signature as vstack",
 "same as vstack","np.vstack(([1,2],[3,4]))","array([[1, 2],\n       [3, 4]])",
 "Legacy alias — was identical to vstack.","Deprecated since NumPy 2.0; call np.vstack() directly in new code.",
 NP+"vstack.html","row_stack deprecated vstack"],
["np.split()","function","np.split(ary, indices_or_sections, axis=0)",
 "ary: input array · indices_or_sections: int (equal parts) or list of split points · axis: split axis",
 "list of sub-arrays","np.split(np.arange(6), 3)","[array([0,1]), array([2,3]), array([4,5])]",
 "Divide an array into equal chunks, e.g. batching.","Raises an error if an integer count does not divide evenly — use array_split() for uneven splits.",
 NP+"split.html","split divide chunks"],
["np.array_split()","function","np.array_split(ary, indices_or_sections, axis=0)",
 "Same as split(), but tolerates uneven sizes",
 "list of sub-arrays, sizes may differ by 1","np.array_split(np.arange(7), 3)","[array([0,1,2]), array([3,4]), array([5,6])]",
 "Chunk data into N roughly-equal groups, e.g. K folds.","Never raises for uneven division — extra elements go to the first chunks.",
 NP+"array_split.html","array_split uneven chunks"],
["np.vsplit()","function","np.vsplit(ary, indices_or_sections)",
 "Splits vertically (along axis 0)",
 "list of sub-arrays","np.vsplit(np.arange(4).reshape(2,2), 2)","[array([[0,1]]), array([[2,3]])]",
 "Split a matrix into row groups.","Shorthand for split(..., axis=0); requires at least 2-D input.",
 NP+"vsplit.html","vsplit rows"],
["np.hsplit()","function","np.hsplit(ary, indices_or_sections)",
 "Splits horizontally (along axis 1, or axis 0 for 1-D)",
 "list of sub-arrays","np.hsplit(np.arange(4).reshape(2,2), 2)","[array([[0],[2]]), array([[1],[3]])]",
 "Split a matrix into column groups, e.g. features vs label.","Shorthand for split(..., axis=1).",
 NP+"hsplit.html","hsplit columns"],
["np.dsplit()","function","np.dsplit(ary, indices_or_sections)",
 "Splits along the 3rd axis (depth); requires at least 3-D input",
 "list of sub-arrays","np.dsplit(np.zeros((2,2,4)), 2)[0].shape","(2, 2, 2)",
 "Split a multi-channel volume into channel groups.","Shorthand for split(..., axis=2).",
 NP+"dsplit.html","dsplit depth channels"],
 ]},

{id:"broadcasting", num:"13", title:"Broadcasting", type:"html", html:`
<div class="prose">
<p>Broadcasting lets NumPy apply elementwise operations to arrays of <b>different but compatible</b> shapes without copying data.</p>
<h3>The rules</h3>
<ul>
<li>Compare shapes starting from the <b>trailing</b> (rightmost) dimension.</li>
<li>Two dimensions are compatible if they are <b>equal</b>, or one of them is <b>1</b>.</li>
<li>Missing leading dimensions are treated as size 1 (arrays are right-aligned).</li>
<li>If any pair of dimensions is unequal and neither is 1, broadcasting <b>fails</b> with a ValueError.</li>
</ul>
<h3>Compatible shapes</h3>
<div class="diagram">A: (3, 4)          B: (4,)   → treated as (1, 4)
      3 x 4              1 x 4
      -------- aligns trailing dim: 4 == 4, other dim 1 stretches to 3
Result: (3, 4)  ✓

A: (8, 1, 6, 1)    B: (7, 1, 5)  → treated as (1, 7, 1, 5)
Result: (8, 7, 6, 5)  ✓  (each axis takes the larger of the two, 1s stretch)</div>
<h3>Incompatible shapes</h3>
<div class="diagram">A: (3, 4)          B: (3,)  → treated as (1, 3)
      3 x 4              1 x 3
      -------- trailing dims: 4 vs 3 → NOT equal, neither is 1
ValueError: operands could not be broadcast together with shapes (3,4) (3,)</div>
<h3>Example</h3>
<pre>a = np.ones((3, 4))
b = np.array([1, 2, 3, 4])   # shape (4,)
a + b                        # b is broadcast across all 3 rows</pre>
<h3>Common errors</h3>
<ul>
<li>Mixing up which axis needs the size-1 placeholder — fix with a[:, np.newaxis] or reshape(-1,1).</li>
<li>Assuming length-N vectors always broadcast against length-N columns — orientation (row vs column) matters.</li>
<li>Silent bugs when a "compatible by coincidence" shape (e.g. both length 3) broadcasts against the wrong axis.</li>
</ul>
</div>`},

{id:"syntax-glance", num:"20", title:"NumPy Syntax at a Glance", type:"html", html:`
<div class="prose">
<h3>Array creation</h3>
<pre>np.array([1,2,3]); np.zeros((r,c)); np.ones((r,c)); np.arange(0,10,2); np.linspace(0,1,5); np.eye(n)</pre>
<h3>Indexing</h3>
<pre>a[0]; a[-1]; a[1:4]; a[::-1]; a[a>0]; a[[0,2]]; a[:, np.newaxis]; a[..., 0]</pre>
<h3>Broadcasting</h3>
<pre>a + b            # shapes align from the right, size-1 dims stretch
a[:, None] + b[None, :]   # classic outer-broadcast trick</pre>
<h3>Reshaping</h3>
<pre>a.reshape(2,-1); a.ravel(); a.T; np.expand_dims(a,0); np.squeeze(a); np.concatenate([a,b])</pre>
<h3>Aggregation</h3>
<pre>a.sum(axis=0); a.mean(); a.std(ddof=1); a.min(axis=1); np.unique(a, return_counts=True)</pre>
<h3>Random</h3>
<pre>rng = np.random.default_rng(seed)
rng.integers(0,10,size=5); rng.random(5); rng.normal(0,1,size=5); rng.choice(a, size=3)</pre>
<h3>Linear algebra</h3>
<pre>A @ B; np.linalg.inv(A); np.linalg.solve(A,b); np.linalg.norm(v); np.linalg.eig(A)</pre>
<h3>Saving files</h3>
<pre>np.save('a.npy', a); np.load('a.npy'); np.savez('bundle.npz', a=a, b=b); np.savetxt('a.csv', a, delimiter=',')</pre>
</div>`},

{id:"mistakes", num:"21", title:"Common Mistakes", type:"html", html:`
<div class="prose">
<div class="mistake"><b>Views vs copies —</b> basic slices share memory with the original array; editing the slice edits the source too. Use .copy() when you need independence.</div>
<div class="mistake"><b>Broadcasting errors —</b> shapes are compared from the right; a "coincidentally matching" length can silently broadcast on the wrong axis instead of raising an error.</div>
<div class="mistake"><b>Shape mismatch —</b> concatenate()/stack() require compatible shapes on all axes except the join axis — check .shape before combining arrays.</div>
<div class="mistake"><b>dtype conversion —</b> astype(int) truncates rather than rounds; integer division of ints stays int and can silently lose precision.</div>
<div class="mistake"><b>Axis confusion —</b> axis=0 reduces DOWN rows (column-wise result); axis=1 reduces ACROSS columns (row-wise result) — easy to swap by mistake.</div>
<div class="mistake"><b>flatten() vs ravel() —</b> flatten() always copies; ravel() returns a view when possible — mutating a ravel() result can unexpectedly change the source array.</div>
<div class="mistake"><b>np.append() in a loop —</b> append() always allocates a brand-new array; calling it repeatedly in a loop is O(n²). Build a Python list and convert once, or pre-allocate.</div>
<div class="mistake"><b>np.matrix vs ndarray —</b> np.matrix is deprecated/legacy and forces 2-D, operator-overloaded matrix math; use plain ndarray with @ instead.</div>
<div class="mistake"><b>Python loops instead of vectorization —</b> looping element-by-element in Python is far slower than an equivalent ufunc/broadcast expression — vectorize whenever possible.</div>
</div>`},

{id:"performance", num:"22", title:"Performance Tips", type:"html", html:`
<div class="prose">
<div class="tip"><b>Vectorize —</b> replace explicit for-loops with array expressions and ufuncs; NumPy's C loops are dramatically faster than Python-level iteration.</div>
<div class="tip"><b>Avoid Python-level loops over elements —</b> even list comprehensions over array elements lose most of NumPy's speed advantage.</div>
<div class="tip"><b>Choose the smallest safe dtype —</b> float32/int32 halve memory versus float64/int64 when the extra precision/range is not needed.</div>
<div class="tip"><b>Prefer views over copies —</b> slicing, ravel(), and reshape() often avoid copying — check a.base or np.shares_memory() to confirm.</div>
<div class="tip"><b>Let broadcasting do the work —</b> broadcasting avoids materializing repeated data in memory compared to manually tiling arrays.</div>
<div class="tip"><b>Avoid unnecessary .copy() calls —</b> only copy when you truly need independent memory; each copy costs both time and RAM.</div>
<div class="tip"><b>Pre-allocate output arrays —</b> use np.empty()/np.zeros() once instead of growing an array with concatenate()/append() in a loop.</div>
<div class="tip"><b>Keep dtypes uniform —</b> object-dtype arrays (mixed Python types) fall back to slow, unvectorized Python-level operations.</div>
</div>`},

/* ============================================================
   RENDER
   ============================================================ */
function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

function kindBadge(k){ return `<span class="badge b-${esc(k)}">${esc(k)}</span>`; }

function codeBlock(text){
  return `<pre data-copy><code>${esc(text)}</code><button class="copybtn" onclick="copyBlock(this)">Copy</button></pre>`;
}

function renderCard(it){
  const [n,k,sig,p,ret,ex,out,use,note,link,tags] = it;
  const params = p.split(" · ").map(seg=>{
    const idx = seg.indexOf(":");
    if(idx===-1) return `<div class="p">${esc(seg)}</div>`;
    return `<div class="p"><b>${esc(seg.slice(0,idx))}</b>${esc(seg.slice(idx))}</div>`;
  }).join("");
  return `<div class="card" data-search="${esc((n+" "+sig+" "+p+" "+use+" "+note+" "+tags).toLowerCase())}">
    <div class="head"><span class="name" data-title>${esc(n)}</span>${kindBadge(k)}</div>
    ${codeBlock(sig)}
    <div class="lbl">Parameters</div><div class="params">${params||'<div class="p">none</div>'}</div>
    <div class="lbl">Returns</div><div class="ret">${esc(ret)}</div>
    <div class="lbl">Example</div>${codeBlock(ex)}
    <div class="lbl">Output</div>${codeBlock(out)}
    <div class="lbl">Common Use</div><div class="use">${esc(use)}</div>
    <div class="lbl">Note</div><div class="note">${esc(note)}</div>
    <div class="foot"><a href="${link}" target="_blank" rel="noopener">Official docs ↗</a></div>
  </div>`;
}

function renderTable(headers, rows){
  const thead = headers.map(h=>`<th>${esc(h)}</th>`).join("");
  const trs = rows.map(r=>{
    const search = r.join(" ").toLowerCase();
    const tds = r.map((c,i)=> i===0
      ? `<td class="mono" data-title>${esc(c)}</td>`
      : `<td>${esc(c)}</td>`).join("");
    return `<tr data-search="${esc(search)}">${tds}</tr>`;
  }).join("");
  return `<div class="tablewrap"><table class="ref"><thead><tr>${thead}</tr></thead><tbody>${trs}</tbody></table></div>`;
}

function renderSnippets(items){
  return `<div class="grid">` + items.map(([title,code,note])=>{
    const search = (title+" "+code+" "+(note||"")).toLowerCase();
    return `<div class="snip" data-search="${esc(search)}">
      <h4 data-title>${esc(title)}</h4>
      ${codeBlock(code)}
      ${note?`<div class="note">${esc(note)}</div>`:""}
    </div>`;
  }).join("") + `</div>`;
}

function renderSection(sec){
  let body = "";
  if(sec.type==="html"){
    body = sec.html;
  } else if(sec.type==="cards"){
    body = `<div class="grid">` + sec.items.map(renderCard).join("") + `</div>`;
  } else if(sec.type==="table"){
    body = renderTable(sec.headers, sec.rows);
  } else if(sec.type==="snippets"){
    body = renderSnippets(sec.items);
  } else if(sec.type==="mixed"){
    body = renderTable(sec.table.headers, sec.table.rows) +
           `<div style="height:14px"></div><div class="grid">` + sec.items.map(renderCard).join("") + `</div>`;
  }
  const descHtml = sec.desc ? `<p class="desc">${esc(sec.desc)}</p>` : "";
  return `<section class="sec" id="${sec.id}">
    <h2><span class="idx">${sec.num}</span>${esc(sec.title)}</h2>
    ${descHtml}
    ${body}
  </section>`;
}

function buildSidebar(){
  const nav = document.getElementById("sidebar");
  nav.innerHTML = SECTIONS.map(s=>`<a href="#${s.id}" data-target="${s.id}"><span class="n">${s.num}</span>${esc(s.title)}</a>`).join("");
}

function buildContent(){
  document.getElementById("content").innerHTML = SECTIONS.map(renderSection).join("");
}

/* ---------- copy buttons ---------- */
function copyBlock(btn){
  const code = btn.previousElementSibling.textContent;
  const done = ()=>{ btn.textContent="Copied!"; btn.classList.add("copied"); setTimeout(()=>{btn.textContent="Copy"; btn.classList.remove("copied");},1200); };
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(code).then(done).catch(done);
  } else {
    const ta=document.createElement("textarea"); ta.value=code; document.body.appendChild(ta); ta.select();
    try{document.execCommand("copy");}catch(e){} document.body.removeChild(ta); done();
  }
}

/* ---------- search ---------- */
const searchInput = document.getElementById("searchInput");
const resultCount = document.getElementById("resultCount");

function clearHighlights(){
  document.querySelectorAll("[data-title]").forEach(el=>{
    if(!el.dataset.raw) el.dataset.raw = el.textContent;
    el.textContent = el.dataset.raw;
  });
}
function highlight(el, q){
  if(!el.dataset.raw) el.dataset.raw = el.textContent;
  const raw = el.dataset.raw;
  const i = raw.toLowerCase().indexOf(q);
  if(i===-1){ el.textContent = raw; return; }
  el.innerHTML = esc(raw.slice(0,i)) + "<mark>" + esc(raw.slice(i,i+q.length)) + "</mark>" + esc(raw.slice(i+q.length));
}

function runSearch(){
  const q = searchInput.value.trim().toLowerCase();
  const filterable = document.querySelectorAll("[data-search]");
  if(!q){
    filterable.forEach(el=>el.classList.remove("hidden"));
    clearHighlights();
    resultCount.style.display="none";
    document.querySelectorAll("section.sec").forEach(s=>s.classList.remove("hidden"));
    return;
  }
  const terms = q.split(/\s+/).filter(Boolean);
  let count = 0;
  filterable.forEach(el=>{
    const hay = el.getAttribute("data-search");
    const match = terms.every(t=>hay.includes(t));
    el.classList.toggle("hidden", !match);
    if(match){
      count++;
      const titleEl = el.matches("[data-title]") ? el : el.querySelector("[data-title]");
      if(titleEl) highlight(titleEl, terms[0]);
    }
  });
  // hide whole sections with zero visible matches (only for filterable-type sections)
  document.querySelectorAll("section.sec").forEach(sec=>{
    const items = sec.querySelectorAll("[data-search]");
    if(items.length===0) return; // static/text sections stay visible
    const anyVisible = Array.from(items).some(el=>!el.classList.contains("hidden"));
    sec.classList.toggle("hidden", !anyVisible);
  });
  resultCount.style.display="block";
  resultCount.textContent = count + (count===1 ? " result" : " results");
}
searchInput.addEventListener("input", runSearch);

document.addEventListener("keydown", (e)=>{
  const tag = (document.activeElement && document.activeElement.tagName) || "";
  if(e.key==="/" && tag!=="INPUT" && tag!=="TEXTAREA"){ e.preventDefault(); searchInput.focus(); }
  if((e.ctrlKey||e.metaKey) && e.key.toLowerCase()==="k"){ e.preventDefault(); searchInput.focus(); searchInput.select(); }
});

/* ---------- theme ---------- */
const themeBtn = document.getElementById("themeBtn");
function setTheme(t){
  document.documentElement.setAttribute("data-theme", t);
  try{ localStorage.setItem("numpy-ref-theme", t); }catch(e){}
}
(function initTheme(){
  let t = "light";
  try{ t = localStorage.getItem("numpy-ref-theme"); }catch(e){}
  if(!t){ t = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"; }
  setTheme(t);
})();
themeBtn.addEventListener("click", ()=>{
  const cur = document.documentElement.getAttribute("data-theme");
  setTheme(cur==="dark" ? "light" : "dark");
});

/* ---------- mobile sidebar ---------- */
const sidebar = document.getElementById("sidebar");
const menuBtn = document.getElementById("menuBtn");
menuBtn.addEventListener("click", ()=> sidebar.classList.toggle("open"));
sidebar.addEventListener("click", (e)=>{ if(e.target.closest("a")) sidebar.classList.remove("open"); });

/* ---------- active section highlighting ---------- */
function setupActiveHighlight(){
  const links = Array.from(document.querySelectorAll("nav.sidebar a"));
  const map = {};
  links.forEach(l=> map[l.dataset.target]=l);
  const io = new IntersectionObserver((entries)=>{
    entries.forEach(en=>{
      if(en.isIntersecting){
        links.forEach(l=>l.classList.remove("active"));
        const l = map[en.target.id];
        if(l) l.classList.add("active");
      }
    });
  }, {rootMargin:"-15% 0px -70% 0px", threshold:0});
  document.querySelectorAll("section.sec").forEach(s=>io.observe(s));
}

/* ---------- back to top ---------- */
const backTop = document.getElementById("backTop");
window.addEventListener("scroll", ()=>{ backTop.classList.toggle("show", window.scrollY>500); });
backTop.addEventListener("click", ()=> window.scrollTo({top:0,behavior:"smooth"}));

/* ---------- init ---------- */
buildSidebar();
buildContent();
setupActiveHighlight();
</script>
